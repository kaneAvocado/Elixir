name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: progress_tree
          POSTGRES_PASSWORD: progress_tree
          POSTGRES_DB: progress_tree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1"
          elixir-version: "1.17.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: progress_tree/assets/package-lock.json

      - name: Install dependencies
        working-directory: progress_tree
        run: mix deps.get

      - name: Setup assets
        working-directory: progress_tree
        run: mix assets.setup

      - name: Build assets
        working-directory: progress_tree
        run: mix assets.build

      - name: Create and migrate test database
        working-directory: progress_tree
        env:
          MIX_ENV: test
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Run tests
        working-directory: progress_tree
        env:
          MIX_ENV: test
        run: mix test
